name: CI and deploy development infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the development infrastructure after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: development-infrastructure
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.14.8"
  TERRAFORM_WORKING_DIRECTORY: terraform/env/dev

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist
          if-no-files-found: error
          retention-days: 7

  lambda:
    name: Lambda syntax checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile Lambda handlers
        run: python -m compileall -q lambda

  terraform-validate:
    name: Terraform format and validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize providers without remote state
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform validate

  deploy-development:
    name: Plan and deploy development
    needs: [frontend, lambda, terraform-validate]
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event.inputs.deploy == 'true')
    environment: development

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm deployment OIDC inputs are present
        shell: bash
        run: |
          if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "AWS_ROLE_TO_ASSUME is missing from the GitHub environment named development."
            exit 1
          fi

          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "AWS_REGION is not configured for the GitHub environment named development; defaulting to us-east-1."
          fi

      - name: Debug OIDC
        shell: bash
        run: |
          echo "=== OIDC DEBUG ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          echo "Repository Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Repository Owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Environment: ${{ github.environment }}"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"

          echo ""
          echo "=== Requesting OIDC token ==="

          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | \
            jq -r '.value')

          echo ""
          echo "=== OIDC TOKEN CLAIMS ==="

          python3 - "$OIDC_TOKEN" <<'PY'
          import sys
          import base64
          import json

          token = sys.argv[1]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "environment"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials through OpenID Connect
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-event-management-platform

      - name: Test AWS OIDC authentication
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize Terraform state
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform init -input=false

      - name: Create deployment plan
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform plan -input=false -out=tfplan

      - name: Apply approved plan
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publish deployment outputs
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform output
